name: Publicar slides no GitHub Pages

# Publica o site a cada push na main (e também permite disparo manual pela aba Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o deploy oficial do Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Não deixa duas publicações rodarem ao mesmo tempo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Montar o site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Copiar os arquivos do site para _site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='_site' \
            --exclude='.DS_Store' \
            --exclude='._*' \
            ./ _site/

      - name: Gerar a página inicial (lista das aulas)
        run: python scripts/gerar_index.py --raiz . --saida _site/index.html

      - name: Desligar o processamento do Jekyll
        run: touch _site/.nojekyll

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
