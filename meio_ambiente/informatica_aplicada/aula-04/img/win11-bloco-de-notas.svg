<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="'Segoe UI Variable','Segoe UI',Inter,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Bloco de Notas do Windows 11 com o menu Exibir aberto e a opção Quebra automática de linha marcada</title><rect width="1600" height="800" fill="#DCE6F2"/><rect x="30" y="30" width="1540" height="740" rx="10" fill="#fff" stroke="#AFBCCB" stroke-width="2"/><path d="M30 40 q0 -10 10 -10 H1560 q10 0 10 10 V86 H30z" fill="#E7ECF3"/><rect x="47.6" y="46.4" width="22.8" height="25.8" rx="3.0" fill="#5DADE2"/><rect x="50.0" y="50.0" width="18.0" height="19.8" rx="1.5" fill="#fff"/><rect x="52.4" y="53.0" width="13.2" height="1.5" fill="#5DADE2"/><rect x="52.4" y="56.9" width="13.2" height="1.5" fill="#5DADE2"/><rect x="52.4" y="60.8" width="13.2" height="1.5" fill="#5DADE2"/><rect x="52.4" y="64.7" width="13.2" height="1.5" fill="#5DADE2"/><path d="M86 86 V48 q0 -8 8 -8 H460 q8 0 8 8 V86z" fill="#fff"/><text x="106" y="71" font-size="18" fill="#1B1B1B" font-weight="600" text-anchor="start" >Exercicio_Digitacao_Aluno.txt</text><text x="444" y="71" font-size="16" fill="#444" font-weight="400" text-anchor="middle" >✕</text><text x="496" y="72" font-size="26" fill="#444" font-weight="400" text-anchor="middle" >+</text><text x="1420" y="70" font-size="20" fill="#222" font-weight="400" text-anchor="middle" >—</text><rect x="1466" y="52" width="16" height="16" fill="none" stroke="#222" stroke-width="2"/><text x="1534" y="72" font-size="20" fill="#222" font-weight="400" text-anchor="middle" >✕</text><rect x="30" y="86" width="1540" height="46" fill="#fff"/><line x1="30" y1="132" x2="1570" y2="132" stroke="#E1E6ED"/><text x="54" y="116" font-size="18" fill="#1B1B1B" font-weight="400" text-anchor="start" >Arquivo</text><text x="150" y="116" font-size="18" fill="#1B1B1B" font-weight="400" text-anchor="start" >Editar</text><rect x="226" y="92" width="86" height="34" rx="5" fill="#E3E9F2"/><text x="240" y="116" font-size="18" fill="#1B1B1B" font-weight="600" text-anchor="start" >Exibir</text><circle cx="1533.0" cy="109.0" r="9.36" fill="none" stroke="#6B7785" stroke-width="4.16" stroke-dasharray="3.6400000000000006 2.6"/><circle cx="1533.0" cy="109.0" r="7.8" fill="#6B7785"/><circle cx="1533.0" cy="109.0" r="3.12" fill="#fff"/><text x="60" y="176" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace">A informática revolucionou o modo como trabalhamos, estudamos e nos comunicamos. Todos os dias,</text><text x="60" y="216" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace">milhões de pessoas utilizam computadores para realizar tarefas que, há algumas décadas, seriam</text><text x="60" y="256" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace">impensáveis de serem feitas com tanta rapidez e eficiência.</text><text x="60" y="296" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace"></text><text x="60" y="336" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace">O domínio das ferramentas básicas de um computador não é apenas uma habilidade útil, mas</text><text x="60" y="376" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace">essencial no mundo contemporâneo. Desde a simples navegação pelo sistema de arquivos até o</text><text x="60" y="416" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace">uso de softwares específicos, cada conhecimento adquirido representa um passo importante na</text><text x="60" y="456" font-size="22" fill="#1B1B1B" font-weight="400" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace">inclusão digital.|</text><rect x="226" y="130" width="420" height="200" rx="8" fill="#FBFCFE" stroke="#B9C5D6" stroke-width="1.5" filter="drop-shadow(0 6px 12px rgba(0,0,0,.18))"/><text x="256" y="179" font-size="20" fill="#1F6FD1" font-weight="700" text-anchor="start" ></text><text x="290" y="179" font-size="19" fill="#1B1B1B" font-weight="400" text-anchor="start" >Zoom</text><text x="616" y="179" font-size="22" fill="#444" font-weight="400" text-anchor="middle" >›</text><text x="256" y="237" font-size="20" fill="#1F6FD1" font-weight="700" text-anchor="start" >✓</text><text x="290" y="237" font-size="19" fill="#1B1B1B" font-weight="400" text-anchor="start" >Barra de status</text><rect x="234" y="262" width="404" height="50" rx="6" fill="#DCE7F6"/><text x="256" y="295" font-size="20" fill="#1F6FD1" font-weight="700" text-anchor="start" >✓</text><text x="290" y="295" font-size="19" fill="#1B1B1B" font-weight="600" text-anchor="start" >Quebra automática de linha</text><path transform="translate(556 286) scale(1.0)" d="M0 0 L0 34 L9 26 L15 40 L21 37 L15 24 L27 24z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/><rect x="30" y="730" width="1540" height="40" fill="#F3F5F9"/><text x="54" y="757" font-size="16" fill="#444" font-weight="400" text-anchor="start" >Ln 8, Col 18    |    100%    |    Windows (CRLF)    |    UTF-8</text><rect x="82" y="36" width="392" height="50" rx="10" fill="none" stroke="#C62828" stroke-width="5"/><circle cx="500" cy="32" r="22" fill="#C62828" stroke="#fff" stroke-width="4"/><text x="500" y="40.36" font-size="25" fill="#fff" font-weight="800" text-anchor="middle" >1</text><rect x="220" y="88" width="98" height="42" rx="10" fill="none" stroke="#C62828" stroke-width="5"/><circle cx="346" cy="108" r="22" fill="#C62828" stroke="#fff" stroke-width="4"/><text x="346" y="116.36" font-size="25" fill="#fff" font-weight="800" text-anchor="middle" >2</text>